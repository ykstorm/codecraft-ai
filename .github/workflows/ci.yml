name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chai-vibe-editor

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          PRISMA_SKIP_POSTGRESQL_CHECK: "true"
        run: npx prisma generate

      - name: Run tests
        run: npm test

  build:
    if: github.ref == 'refs/heads/main'  # only push image on merge to main, not on every PR
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          PRISMA_SKIP_POSTGRESQL_CHECK: "true"
        run: npx prisma generate

      - name: Build app
        env:
          PRISMA_SKIP_POSTGRESQL_CHECK: "true"
        run: |
          echo "AUTH_SECRET=ci-dummy-secret-for-build-only" >> .env
          echo "AUTH_GITHUB_ID=000000000000000000000" >> .env
          echo "AUTH_GITHUB_SECRET=ci-dummy-secret" >> .env
          echo "AUTH_GOOGLE_ID=000000000000000000000" >> .env
          echo "AUTH_GOOGLE_SECRET=ci-dummy-secret" >> .env
          echo "DATABASE_URL=mongodb://localhost:27017/ci_test" >> .env
          npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
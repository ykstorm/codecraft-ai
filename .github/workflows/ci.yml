name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/codecraft

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        env:
          PRISMA_SKIP_POSTGRESQL_CHECK: "true"
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        env:
          PRISMA_SKIP_POSTGRESQL_CHECK: "true"
        run: npx prisma generate
      - name: Run tests
        run: npm test

  audit:
    name: Audit (prod deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  smoke:
    name: Smoke (e2e)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Build
        env:
          PRISMA_SKIP_POSTGRESQL_CHECK: "true"
        run: |
          cat > .env <<'EOF'
          AUTH_SECRET=ci-dummy-secret-for-smoke-only
          AUTH_TRUST_HOST=true
          AUTH_GITHUB_ID=000000000000000000000
          AUTH_GITHUB_SECRET=ci-dummy-secret
          AUTH_GOOGLE_ID=000000000000000000000
          AUTH_GOOGLE_SECRET=ci-dummy-secret
          DATABASE_URL=mongodb://localhost:27017/ci_test
          EOF
          npm run build
      - name: Run smoke tests
        run: npx playwright test

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, smoke, audit]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        env:
          PRISMA_SKIP_POSTGRESQL_CHECK: "true"
        run: npx prisma generate
      - name: Build app
        env:
          PRISMA_SKIP_POSTGRESQL_CHECK: "true"
        run: |
          cat > .env <<'EOF'
          AUTH_SECRET=ci-dummy-secret-for-build-only
          AUTH_GITHUB_ID=000000000000000000000
          AUTH_GITHUB_SECRET=ci-dummy-secret
          AUTH_GOOGLE_ID=000000000000000000000
          AUTH_GOOGLE_SECRET=ci-dummy-secret
          DATABASE_URL=mongodb://localhost:27017/ci_test
          EOF
          npm run build
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # This job only runs for v* tags: push the tag name and sha-<short>.
          # The default latest=auto flavor adds latest for tag events.
          tags: |
            type=ref,event=tag
            type=sha
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
